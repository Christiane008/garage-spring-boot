<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Pièce détachée</title></head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    <main>
        <h1 th:text="${estModification} ? 'Modifier la pièce' : 'Ajouter une pièce'"></h1>

        <form th:action="${estModification} ? @{/pieces/{id}(id=${pieceId})} : @{/pieces}"
              th:object="${piece}" method="post">

            <label>Référence :
                <input type="text" th:field="*{reference}"/>
            </label>
            <span th:if="${#fields.hasErrors('reference')}" th:errors="*{reference}" style="color:red;"></span>
            <br/>

            <label>Nom :
                <input type="text" th:field="*{nom}"/>
            </label>
            <span th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}" style="color:red;"></span>
            <br/>

            <label>Prix unitaire :
                <input type="number" step="0.01" th:field="*{prixUnitaire}"/>
            </label>
            <span th:if="${#fields.hasErrors('prixUnitaire')}" th:errors="*{prixUnitaire}" style="color:red;"></span>
            <br/>

            <label>Quantité en stock :
                <input type="number" th:field="*{quantiteStock}"/>
            </label>
            <span th:if="${#fields.hasErrors('quantiteStock')}" th:errors="*{quantiteStock}" style="color:red;"></span>
            <br/>

            <button type="submit">Enregistrer</button>
        </form>
    </main>
</body>
</html>
