<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Véhicules</title></head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    <main>
        <h1>Liste des véhicules</h1>
        <a th:href="@{/vehicules/recherche}">Recherche avancée</a>
        <table border="1">
            <tr>
                <th>Immatriculation</th><th>Marque</th><th>Modèle</th><th>Année</th><th>Km</th><th>Propriétaire</th><th>Actions</th>
            </tr>
            <tr th:each="vehicule : ${vehicules}">
                <td th:text="${vehicule.immatriculation}"></td>
                <td th:text="${vehicule.marque}"></td>
                <td th:text="${vehicule.modele}"></td>
                <td th:text="${vehicule.annee}"></td>
                <td th:text="${vehicule.kilometrage}"></td>
                <td th:text="${vehicule.proprietaire.nom}"></td>
                <td>
                    <a th:href="@{/vehicules/{id}(id=${vehicule.id})}">Détail</a>
                </td>
            </tr>
        </table>
        <p th:if="${vehicules.isEmpty()}">Aucun véhicule enregistré.</p>
    </main>
</body>
</html>
