<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Pièces détachées</title></head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    <main>
        <h1>Stock de pièces détachées</h1>
        <a th:href="@{/pieces/nouveau}">Ajouter une pièce</a>

        <table border="1">
            <tr>
                <th>Référence</th><th>Nom</th><th>Prix unitaire</th><th>Quantité en stock</th><th>Actions</th>
            </tr>
            <tr th:each="piece : ${pieces}">
                <td th:text="${piece.reference}"></td>
                <td th:text="${piece.nom}"></td>
                <td th:text="${piece.prixUnitaire}"></td>
                <td th:text="${piece.quantiteStock}"></td>
                <td>
                    <a th:href="@{/pieces/{id}(id=${piece.id})}">Détail</a>
                    <a th:href="@{/pieces/{id}/modifier(id=${piece.id})}">Modifier</a>
                    <form th:action="@{/pieces/{id}/supprimer(id=${piece.id})}" method="post" style="display:inline">
                        <button type="submit" onclick="return confirm('Confirmer la suppression ?');">Supprimer</button>
                    </form>
                </td>
            </tr>
        </table>
        <p th:if="${pieces.isEmpty()}">Aucune pièce en stock.</p>
    </main>
</body>
</html>
